name: Build standalone Noor Quran APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build independent Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Noor Quran project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle complete Quran text for offline reading
        run: |
          mkdir -p noor-app/app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            "https://api.alquran.cloud/v1/quran/quran-uthmani" \
            -o noor-app/app/src/main/assets/quran_offline.json
          python3 - <<'PY'
          import json
          p = "noor-app/app/src/main/assets/quran_offline.json"
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          surahs = data.get("data", {}).get("surahs", [])
          ayahs = sum(len(s.get("ayahs", [])) for s in surahs)
          assert len(surahs) == 114 and ayahs >= 6200, (len(surahs), ayahs)
          print(f"Verified offline Quran data: {len(surahs)} surahs, {ayahs} ayahs")
          PY

      - name: Build standalone app
        working-directory: noor-app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="noor-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p verified
          cp "$APK" verified/Noor-Quran.apk
          unzip -t verified/Noor-Quran.apk
          ls -lh verified/Noor-Quran.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-APK
          path: verified/Noor-Quran.apk
          if-no-files-found: error
