name: Build standalone Noor Quran APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build independent Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Noor Quran project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python image optimizer
        run: python3 -m pip install --user Pillow

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle and optimize all 604 Mushaf pages for offline reading
        run: |
          set -euo pipefail
          mkdir -p noor-app/app/src/main/assets/mushaf
          git clone --depth 1 https://github.com/akram-seid/quran-hd-images.git /tmp/quran-hd-images
          python3 - <<'PY'
          import os
          from PIL import Image
          src = "/tmp/quran-hd-images/images"
          dst = "noor-app/app/src/main/assets/mushaf"
          missing = []
          total_before = 0
          total_after = 0
          for page in range(1, 605):
              name = f"{page:03d}.jpg"
              source = os.path.join(src, name)
              target = os.path.join(dst, name)
              if not os.path.isfile(source):
                  missing.append(name)
                  continue
              total_before += os.path.getsize(source)
              with Image.open(source) as im:
                  im = im.convert("RGB")
                  # Smaller offline pages reduce the APK size while remaining suitable for phone reading.
                  if im.width > 1200:
                      h = round(im.height * 1200 / im.width)
                      im = im.resize((1200, h), Image.Resampling.LANCZOS)
                  im.save(target, "JPEG", quality=72, optimize=True, progressive=False)
              total_after += os.path.getsize(target)
          if missing:
              raise SystemExit(f"Missing Mushaf pages ({len(missing)}): {missing[:10]}")
          print(f"Verified all 604 pages. Images: {total_before/1024/1024:.1f} MiB -> {total_after/1024/1024:.1f} MiB")
          PY

      - name: Build standalone app
        working-directory: noor-app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="noor-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p verified
          cp "$APK" verified/Noor-Quran.apk
          unzip -t verified/Noor-Quran.apk
          ls -lh verified/Noor-Quran.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-APK
          path: verified/Noor-Quran.apk
          if-no-files-found: error
