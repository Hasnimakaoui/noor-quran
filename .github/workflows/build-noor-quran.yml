name: Build Noor Quran APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Madani Quran APK and verify output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Quran Android source
        uses: actions/checkout@v4
        with:
          repository: quran/quran_android
          ref: main
          path: source
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Set app display name
        working-directory: source
        run: |
          test -f app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">Quran</string>#<string name="app_name">نور القرآن</string>#' app/src/main/res/values/strings.xml
          grep -F '<string name="app_name">نور القرآن</string>' app/src/main/res/values/strings.xml
      - name: Build Madani variant
        working-directory: source
        run: |
          chmod +x ./gradlew
          ./gradlew assembleMadaniDebug --stacktrace
      - name: Verify and rename APK
        working-directory: source
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p ../verified
          cp "$APK" ../verified/Noor-Quran.apk
          test -s ../verified/Noor-Quran.apk
          ls -lh ../verified/Noor-Quran.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-APK
          path: verified/Noor-Quran.apk
          if-no-files-found: error
